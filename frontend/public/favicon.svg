<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e0f7fa" stop-opacity="0.8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#003366" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Outer Cross Outline / Capsule Glow -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="12">
    <rect x="206" y="96" width="100" height="320" rx="50" />
    <rect x="96" y="206" width="320" height="100" rx="50" />
  </g>

  <!-- Solid Cross Elements -->
  <rect x="212" y="102" width="88" height="308" rx="44" fill="url(#crossGrad)" />
  <rect x="102" y="212" width="308" height="88" rx="44" fill="url(#crossGrad)" />

  <!-- Center Capsule Pill Detail Line -->
  <line x1="256" y1="212" x2="256" y2="300" stroke="#00b4d8" stroke-width="6" stroke-linecap="round" />
</svg>
